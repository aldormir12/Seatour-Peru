name: SeaTour CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    name: Backend - Java 21 / H2
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SPRING_PROFILES_ACTIVE: test
      SPRING_DATASOURCE_URL: 'jdbc:h2:mem:seatour-ci;DB_CLOSE_DELAY=-1;MODE=PostgreSQL'
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.h2.Driver
      SPRING_DATASOURCE_USERNAME: sa
      SPRING_DATASOURCE_PASSWORD: ''
      SPRING_JPA_HIBERNATE_DDL_AUTO: create-drop
      SEATOUR_IA_HABILITADA: 'false'
      SEATOUR_IA_ACCIONES_AUTOMATICAS: 'false'
      SEATOUR_IA_POLITICA_REVISADA: 'false'
      SEATOUR_GROQ_CONTEXTUAL_HABILITADO: 'false'
      SEATOUR_CORREO_HABILITADO: 'false'
      OPENAI_API_KEY: ''
      GROQ_API_KEY: ''
      LIVEKIT_URL: ''
      LIVEKIT_API_KEY: ''
      LIVEKIT_API_SECRET: ''
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Prepare temporary storage
        env:
          SEATOUR_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/tours
          SEATOUR_EMBARCACIONES_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/embarcaciones
          SEATOUR_EXPERIENCIAS_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/experiencias
        run: mkdir -p "$SEATOUR_IMAGENES_DIRECTORIO" "$SEATOUR_EMBARCACIONES_IMAGENES_DIRECTORIO" "$SEATOUR_EXPERIENCIAS_IMAGENES_DIRECTORIO"
      - name: Test with in-memory H2
        env:
          SEATOUR_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/tours
          SEATOUR_EMBARCACIONES_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/embarcaciones
          SEATOUR_EXPERIENCIAS_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/experiencias
        run: bash ./mvnw -B -ntp -Dspring.profiles.active=test test
      - name: Package after successful tests
        env:
          SEATOUR_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/tours
          SEATOUR_EMBARCACIONES_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/embarcaciones
          SEATOUR_EXPERIENCIAS_IMAGENES_DIRECTORIO: ${{ runner.temp }}/seatour-ci/experiencias
        run: bash ./mvnw -B -ntp -DskipTests package

  frontend:
    name: Frontend - Node 24 / Vitest
    outputs:
      vitest-outcome: ${{ steps.vitest.outcome }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: seatour-frontend-angular
    env:
      CI: 'true'
      NG_CLI_ANALYTICS: 'false'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: seatour-frontend-angular/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Build static frontend
        run: npm run build -- --configuration docker
      - name: Pruebas Angular - pendientes de estabilización
        id: vitest
        continue-on-error: true
        run: npm test -- --watch=false

  entrega:
    name: Entrega - imagenes Docker descargables
    needs: [backend, frontend]
    if: ${{ needs.backend.result == 'success' && needs.frontend.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      SOURCE_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}
      VITEST_OUTCOME: ${{ needs.frontend.outputs.vitest-outcome }}
      MAX_ARCHIVE_BYTES: '209715200'
    steps:
      - name: Checkout del commit validado
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Preparar contextos temporales de archivos versionados
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, pathlib, shutil, subprocess
          root = pathlib.Path.cwd()
          delivery = pathlib.Path(os.environ["RUNNER_TEMP"]) / "seatour-delivery"
          backend = delivery / "contexts/backend"
          frontend = delivery / "contexts/frontend"
          output = delivery / "output"
          for path in (backend, frontend, output):
              path.mkdir(parents=True, exist_ok=True)
          commit = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if commit != os.environ["GITHUB_SHA"]:
              raise SystemExit("Checkout distinto del commit validado")
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).decode().split("\0")
          frontend_root = {
              "Dockerfile", ".dockerignore", ".postcssrc.json", "angular.json",
              "package.json", "package-lock.json", "nginx.conf", "nginx-api.conf",
              "tsconfig.json", "tsconfig.app.json", "tsconfig.spec.json"
          }
          selected = []
          for name in filter(None, tracked):
              path = pathlib.PurePosixPath(name)
              destination = None
              if name in {"Dockerfile", ".dockerignore", "pom.xml"} or name.startswith("src/main/"):
                  destination = backend / name
              elif name.startswith("seatour-frontend-angular/"):
                  relative = path.relative_to("seatour-frontend-angular")
                  if str(relative) in frontend_root or relative.parts[0] in {"src", "public"}:
                      destination = frontend / str(relative)
              if destination is None:
                  continue
              parts = {part.lower() for part in path.parts}
              forbidden = {"uploads", "backups", "backup", "data", ".git", ".aws", ".seatour-local", ".seatour-docker", "node_modules"}
              if parts & forbidden or any(part.lower().startswith(".env") for part in path.parts):
                  raise SystemExit("Archivo privado rechazado en contexto")
              if path.suffix.lower() in {".dump", ".sql", ".db", ".log", ".pem", ".key", ".p12", ".pfx", ".zip", ".gz", ".tar"}:
                  raise SystemExit("Archivo de datos o credenciales rechazado")
              source = root / name
              if source.is_symlink() or not source.is_file():
                  raise SystemExit("Solo se admiten archivos regulares versionados")
              destination.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(source, destination)
              selected.append(name)
          for required in (backend / "Dockerfile", backend / "pom.xml", frontend / "Dockerfile", frontend / "package-lock.json"):
              if not required.is_file():
                  raise SystemExit("Contexto incompleto")
          with open(os.environ["GITHUB_ENV"], "a") as env:
              env.write(f"BUILD_COMMIT={commit}\n")
              env.write(f"BACKEND_IMAGE=seatour-backend:sha-{commit}\n")
              env.write(f"FRONTEND_IMAGE=seatour-frontend:sha-{commit}\n")
              env.write(f"DELIVERY_ROOT={delivery}\n")
          print(f"Contextos preparados con {len(selected)} archivos; commit {commit}")
          PY
      - name: Construir imagenes linux-amd64 sin iniciar servicios
        shell: bash
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$BUILD_COMMIT" --tag "$BACKEND_IMAGE" "$DELIVERY_ROOT/contexts/backend"
          docker build --platform linux/amd64 --label "org.opencontainers.image.revision=$BUILD_COMMIT" --tag "$FRONTEND_IMAGE" "$DELIVERY_ROOT/contexts/frontend"
      - name: Exportar imagenes y generar manifiesto
        shell: bash
        run: |
          set -euo pipefail
          docker save "$BACKEND_IMAGE" "$FRONTEND_IMAGE" | gzip -1 > "$DELIVERY_ROOT/output/seatour-images.tar.gz"
          python3 - <<'PY'
          import datetime, hashlib, json, os, pathlib, subprocess
          output = pathlib.Path(os.environ["DELIVERY_ROOT"]) / "output"
          archive = output / "seatour-images.tar.gz"
          sha = hashlib.sha256()
          with archive.open("rb") as stream:
              for chunk in iter(lambda: stream.read(1024 * 1024), b""):
                  sha.update(chunk)
          images = []
          for key in ("BACKEND_IMAGE", "FRONTEND_IMAGE"):
              name = os.environ[key]
              data = json.loads(subprocess.check_output(["docker", "image", "inspect", name], text=True))[0]
              platform = data["Os"] + "/" + data["Architecture"]
              if platform != "linux/amd64":
                  raise SystemExit("Plataforma inesperada")
              images.append({"name": name, "image_id": data["Id"], "platform": platform, "uncompressed_size_bytes": data["Size"]})
          size = archive.stat().st_size
          manifest = {
              "schema_version": 1,
              "build_commit": os.environ["BUILD_COMMIT"],
              "source_commit": os.environ["SOURCE_COMMIT"],
              "event": os.environ["GITHUB_EVENT_NAME"],
              "run_url": os.environ["GITHUB_SERVER_URL"] + "/" + os.environ["GITHUB_REPOSITORY"] + "/actions/runs/" + os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "created_at": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "platform": "linux/amd64",
              "images": images,
              "archive": archive.name,
              "archive_size_bytes": size,
              "archive_sha256": sha.hexdigest(),
              "max_archive_bytes": int(os.environ["MAX_ARCHIVE_BYTES"]),
              "angular_tests": {
                  "blocking": False,
                  "outcome": os.environ["VITEST_OUTCOME"],
                  "note": "Vitest es informativo y tiene fallos conocidos pendientes de estabilizacion; no se certifica aprobado por el exito del job."
              },
              "deployment_performed": False
          }
          (output / "manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          (output / "SHA256SUMS").write_text(sha.hexdigest() + "  " + archive.name + "\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
              summary.write(f"## Paquete Docker candidato\nCommit construido: {manifest['build_commit']}\n\nCommit origen: {manifest['source_commit']}\n\nTamano comprimido: {size} bytes ({size / 1024**2:.2f} MiB).\n\n")
              summary.write(f"Vitest informativo: {manifest['angular_tests']['outcome']}; fallos conocidos pendientes de estabilizacion.\n\nNo se ha desplegado ni probado el arranque de estas imagenes.\n\n")
          print(f"Archivo: {size} bytes; SHA256: {sha.hexdigest()}")
          PY
      - name: Comprobar limite antes de publicar
        shell: bash
        run: |
          set -euo pipefail
          size=$(stat -c %s "$DELIVERY_ROOT/output/seatour-images.tar.gz")
          if (( size > MAX_ARCHIVE_BYTES )); then
            echo "::error::Paquete de $size bytes supera el limite conservador de $MAX_ARCHIVE_BYTES bytes. Publicacion omitida."
            echo "### Entrega NO publicada: limite de tamano superado ($size bytes)." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
      - name: Publicar un unico artefacto Docker
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: seatour-docker-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DELIVERY_ROOT }}/output/seatour-images.tar.gz
            ${{ env.DELIVERY_ROOT }}/output/manifest.json
            ${{ env.DELIVERY_ROOT }}/output/SHA256SUMS
          if-no-files-found: error
          retention-days: 1
          compression-level: 0
      - name: Confirmar paquete publicado
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
        run: |
          echo "### Entrega publicada" >> "$GITHUB_STEP_SUMMARY"
          echo "Artefacto descargable: $ARTIFACT_URL" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest del artefacto GitHub: $ARTIFACT_DIGEST" >> "$GITHUB_STEP_SUMMARY"
          echo "Retencion: un dia. Recuperacion manual; sin despliegue." >> "$GITHUB_STEP_SUMMARY"