spring.application.name=seatour
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
seatour.imagenes.directorio=${SEATOUR_IMAGENES_DIRECTORIO:./uploads/tours}
seatour.embarcaciones.imagenes.directorio=${SEATOUR_EMBARCACIONES_IMAGENES_DIRECTORIO:./uploads/embarcaciones}

# No truncar cantidades fraccionarias al deserializar enteros (pasajeros e identificadores).
spring.jackson.deserialization.accept-float-as-int=false

spring.datasource.url=jdbc:h2:file:./data/seatourdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secreto Base64 de al menos 32 bytes aleatorios; obligatorio fuera de pruebas.
seatour.jwt.secret=${SEATOUR_JWT_SECRET}
seatour.jwt.expiration-seconds=${SEATOUR_JWT_EXPIRATION_SECONDS:3600}
seatour.jwt.issuer=${SEATOUR_JWT_ISSUER:seatour}

# Correo de confirmacion. Sin SMTP, el comprobante queda pendiente en H2.
seatour.correo.habilitado=${SEATOUR_CORREO_HABILITADO:false}
seatour.correo.remitente=${SEATOUR_CORREO_REMITENTE:}
spring.mail.host=${SEATOUR_SMTP_HOST:localhost}
spring.mail.port=${SEATOUR_SMTP_PORT:587}
spring.mail.username=${SEATOUR_SMTP_USUARIO:}
spring.mail.password=${SEATOUR_SMTP_PASSWORD:}
spring.mail.properties.mail.smtp.auth=${SEATOUR_SMTP_AUTH:true}
spring.mail.properties.mail.smtp.starttls.enable=${SEATOUR_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.starttls.required=${SEATOUR_SMTP_STARTTLS:true}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
