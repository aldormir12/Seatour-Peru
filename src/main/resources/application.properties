spring.application.name=seatour

spring.datasource.url=jdbc:h2:file:./data/seatourdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secreto Base64 de al menos 32 bytes aleatorios; obligatorio fuera de pruebas.
seatour.jwt.secret=${SEATOUR_JWT_SECRET}
seatour.jwt.expiration-seconds=${SEATOUR_JWT_EXPIRATION_SECONDS:3600}
seatour.jwt.issuer=${SEATOUR_JWT_ISSUER:seatour}
