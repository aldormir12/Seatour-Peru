spring.application.name=seatour
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
seatour.imagenes.directorio=${SEATOUR_IMAGENES_DIRECTORIO:./uploads/tours}

# No truncar cantidades fraccionarias al deserializar enteros (pasajeros e identificadores).
spring.jackson.deserialization.accept-float-as-int=false

spring.datasource.url=jdbc:h2:file:./data/seatourdb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Secreto Base64 de al menos 32 bytes aleatorios; obligatorio fuera de pruebas.
seatour.jwt.secret=${SEATOUR_JWT_SECRET}
seatour.jwt.expiration-seconds=${SEATOUR_JWT_EXPIRATION_SECONDS:3600}
seatour.jwt.issuer=${SEATOUR_JWT_ISSUER:seatour}
