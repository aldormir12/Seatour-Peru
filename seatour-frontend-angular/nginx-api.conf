# Sin URI al final: conserva /api y los parámetros al enviar al backend.
proxy_pass http://backend:8080;
proxy_http_version 1.1;
proxy_set_header Host $http_host;
proxy_set_header X-Forwarded-Host $http_host;
proxy_set_header X-Forwarded-Proto $seatour_forwarded_proto;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header Forwarded "";
proxy_set_header X-Forwarded-Port "";
proxy_connect_timeout 10s;
proxy_read_timeout 60s;
# Conserva las respuestas y estados de ApiErrores, sin fallback al HTML de Angular.
proxy_intercept_errors off;
