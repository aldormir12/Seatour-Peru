# Cloudflare termina HTTPS y envía X-Forwarded-Proto; localhost usa $scheme.
map $http_x_forwarded_proto $seatour_forwarded_proto {
    default $scheme;
    http http;
    https https;
}

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    client_max_body_size 6m;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /api {
        include /etc/nginx/seatour-api.conf;
    }

    location ^~ /api/ {
        include /etc/nginx/seatour-api.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }
}
